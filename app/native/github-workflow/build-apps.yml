# Builds the Windows installer and the Android app, then publishes them as a GitHub Release.
#
# Put this file in your repository at:  .github/workflows/build-apps.yml
# Then: GitHub → Actions → "Build Windows and Android apps" → Run workflow → enter a version → Run.
#
# It finds the app automatically: an "app" folder, the repository root, or the highest
# "character-codex-35_N/character-codex-35" folder — whichever has a "native" folder in it.
name: Build Windows and Android apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (like 1.0.0 — three numbers)"
        required: true
        default: "1.0.0"
      app_dir:
        description: "Folder holding index.html and native/ (leave blank to find it automatically)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.find.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        run: |
          d="${{ github.event.inputs.app_dir }}"
          if [ -z "$d" ]; then
            if [ -d app/native ]; then d=app
            elif [ -d native ]; then d=.
            else d=$(ls -d character-codex-35_*/character-codex-35 2>/dev/null | while read x; do [ -d "$x/native" ] && echo "$x"; done | sort -V | tail -1)
            fi
          fi
          if [ -z "$d" ] || [ ! -f "$d/index.html" ] || [ ! -d "$d/native" ]; then echo "::error::Could not find a folder with index.html and native/. Enter it in 'app_dir'."; exit 1; fi
          echo "Using app folder: $d"; echo "dir=$d" >> "$GITHUB_OUTPUT"

  windows:
    needs: locate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.locate.outputs.dir }}/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the app into native/www
        run: node prepare.mjs
      - name: Set the version
        run: |
          node -e "const f='tauri/src-tauri/tauri.conf.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));j.version='${{ github.event.inputs.version }}';fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Build the Windows installers
        working-directory: ${{ needs.locate.outputs.dir }}/native/tauri
        run: |
          npm install --no-audit --no-fund
          npx tauri build
      - name: Collect installers
        run: |
          OUT="$(git rev-parse --show-toplevel)/out"; mkdir -p "$OUT"
          cp tauri/src-tauri/target/release/bundle/nsis/*.exe "$OUT/3.5-Character-Codex-${{ github.event.inputs.version }}-Windows-setup.exe"
          cp tauri/src-tauri/target/release/bundle/msi/*.msi "$OUT/3.5-Character-Codex-${{ github.event.inputs.version }}-Windows.msi"
          ls -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    needs: locate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.locate.outputs.dir }}/native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the Android project
        run: |
          npm install --no-audit --no-fund
          node ../prepare.mjs
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Set the version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "${{ github.event.inputs.version }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect the APK
        run: |
          OUT="$(git rev-parse --show-toplevel)/out"; mkdir -p "$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/3.5-Character-Codex-${{ github.event.inputs.version }}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: 3.5 Character Codex ${{ github.event.inputs.version }}
          files: dist/*
          body: |
            **Windows:** download `...-Windows-setup.exe` and run it. (If Windows SmartScreen warns about an unknown publisher, choose *More info → Run anyway*.)
            **Android:** download `...-Android.apk` on your phone and open it. Android will ask you to allow installing apps from your browser or Files app.
            **Any device:** you can also use it in your browser, or install it from the website with the *Install app* button.

            Your characters stay on each device. Use **Export** and **Import** to move them between devices.
